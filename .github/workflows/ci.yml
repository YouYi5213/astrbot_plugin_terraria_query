name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Validate categories manifest
        run: python -m json.tool data/terraria_query/categories/manifest.json > /dev/null

      - name: Run tests
        run: pytest tests/ -q
